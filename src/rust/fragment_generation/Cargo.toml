[package]
name = "fragment_generation"
version = "0.1.0"
edition = "2021"
description = "Fragment generation"

[[bin]]
name = "fragment_generation"
path = "fragment_generation.rs"

[dependencies]
csv = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true