[package]
name        = "rendogbs_finder"
version     = "0.1.0"
edition     = "2021"
description = "Aho-Corasick cut-site finder for rendogbs pipeline"

[[bin]]
name = "rendogbs_finder"
path = "main.rs"

[dependencies]
aho-corasick   = "1"
csv            = "1"
clap           = { version = "4", features = ["derive"] }
needletail     = "0.5"
rayon          = "1"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true